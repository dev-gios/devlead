# DevLead server (S20): one long-lived container, built locally from this
# repository, that runs DevLead's jobs on a schedule (S11).
#
#   cp docker/devlead.env.example .env && chmod 600 .env    # then fill it in
#   DEVLEAD_SOURCE_REV="$(git rev-parse HEAD)" docker compose up -d --build
#   docker compose ps                         # STATUS shows (healthy)
#   docker compose logs -f                    # the jobs and their audit lines
#
# DEVLEAD_SOURCE_REV records the commit the image is built from (doctor.sh
# checks the image against it); without it the scheduled claude runs refuse to
# start. The schedule, the time zone and the session limits are in .env
# (docker/devlead.env.example lists them); restart the container after a
# change. Pause every job and session, and resume:
#   docker compose exec -u root devlead touch /home/devlead/.devlead/PAUSE
#   docker compose exec -u root devlead rm /home/devlead/.devlead/PAUSE
# Run a job now: docker compose exec -u devlead devlead /opt/devlead/docker/run-job.sh fleet
#
# The jobs work in the container's own clones of the repos in DEVLEAD_REPOS
# (the workspace volume), reset to origin's default branch before each job;
# your working copies are never touched. Drop the clones of repos you no
# longer enroll with: docker compose down && docker volume rm devlead_workspace
#
# Everything secret comes from .env, which stays out of git and out of the
# image (.dockerignore); none of your ~/.devlead secrets (gh-token,
# notify.env, loop.env) is mounted. compose also reads DEVLEAD_UID and DEVLEAD_GID from it
# and refuses to go on without them: the container must run as your user, and
# a silent default could be someone else's. DEVLEAD_ENV_FILE and DEVLEAD_IMAGE
# exist so the smoke test (make docker-test) can use dummy values and its own
# image tag.
name: devlead

services:
  devlead:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DEVLEAD_UID: ${DEVLEAD_UID:?set DEVLEAD_UID in .env to the output of `id -u`}
        DEVLEAD_GID: ${DEVLEAD_GID:?set DEVLEAD_GID in .env to the output of `id -g`}
        DEVLEAD_SOURCE_REV: ${DEVLEAD_SOURCE_REV:-}
    image: ${DEVLEAD_IMAGE:-devlead-server:local}
    restart: unless-stopped
    env_file:
      - path: ${DEVLEAD_ENV_FILE:-.env}
        required: true
    # The entrypoint applies the egress firewall as root, then drops every
    # capability before it runs anything else (S8).
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    healthcheck:
      test: ["CMD", "/opt/devlead/docker/init-firewall.sh", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      # S13: the clones of the enrolled repos (DEVLEAD_REPOS), each at the path
      # its repo has on the host, so the state the host's /devlead keys by
      # repo path is the same key here. Only the container sees this volume:
      # your own working copies are never mounted.
      # L18: the claude wrapper's session ledger and locks, root's. A volume
      # of their own, so the day's session count survives a recreated
      # container; no session can reach it, and it is not on the host.
      - type: volume
        source: runner-state
        target: /var/lib/devlead
      - type: volume
        source: workspace
        target: ${DEVLEAD_WORKSPACE:?set DEVLEAD_WORKSPACE in .env to the host directory that holds your repos}
      # S14: the host's state the jobs share with the morning /devlead, and
      # only that: these subdirectories of DEVLEAD_STATE_DIR (your ~/.devlead)
      # and the inbox — never gh-token, notify.env, loop.env or anything else
      # in it. They are written as your user (DEVLEAD_UID), each TSV writer
      # under flock. learn/ is read-only: the jobs only read preferences.
      # profile/ and run/ stay the container's. Each must exist on the host
      # before the first start (compose does not create them); see
      # docker/devlead.env.example.
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/agenda", target: /home/devlead/.devlead/agenda, bind: {create_host_path: false}}
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/audit", target: /home/devlead/.devlead/audit, bind: {create_host_path: false}}
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/decisions", target: /home/devlead/.devlead/decisions, bind: {create_host_path: false}}
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/journals", target: /home/devlead/.devlead/journals, bind: {create_host_path: false}}
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/outcomes", target: /home/devlead/.devlead/outcomes, bind: {create_host_path: false}}
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/reports", target: /home/devlead/.devlead/reports, bind: {create_host_path: false}}
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/run-state", target: /home/devlead/.devlead/run-state, bind: {create_host_path: false}}
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/learn", target: /home/devlead/.devlead/learn, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/inbox.tsv", target: /home/devlead/.devlead/inbox.tsv, bind: {create_host_path: false}}
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/inbox.read.tsv", target: /home/devlead/.devlead/inbox.read.tsv, bind: {create_host_path: false}}
      # S25: the envelope store, the envelopes the user keeps outside the
      # repos. Read-only, at a fixed root-owned path: no session can write what
      # grants it authority, and envelope.sh never takes this path from HOME.
      - {type: bind, source: "${DEVLEAD_STATE_DIR:?set DEVLEAD_STATE_DIR in .env to the absolute path of your ~/.devlead}/envelopes", target: /etc/devlead/envelopes, read_only: true, bind: {create_host_path: false}}
      # L21 A2: the loop's plan, read-only, at a staging path; the entrypoint
      # validates it as root and installs a root-owned copy where the loop
      # reads it. Without DEVLEAD_LOOP_PLAN, docker/no-loop-plan.yml stands
      # in and no plan is installed.
      - {type: bind, source: "${DEVLEAD_LOOP_PLAN:-./docker/no-loop-plan.yml}", target: /run/devlead/host-plan.yml, read_only: true, bind: {create_host_path: false}}

volumes:
  workspace:
  runner-state:
